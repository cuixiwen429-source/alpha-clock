<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>半衰期 · Alpha Clock</title>
<link rel="stylesheet" href="css/base.css" />
<script>
  if (!/^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname)) {
    document.documentElement.classList.add("deployed");
  }
</script>
</head>
<body>
<main>
  <h1>火种离开奥林匹斯，开始冷却。</h1>
  <p class="dim">每一条信号都是一团叫 Halfie 的火。它一离开众神就开始变冷，每 400 毫秒少一颗火星。越早伸手，火越烫，代价也越高。最后一颗火星飘走之后，它属于所有人。</p>
  <p class="dim dev-only">后端：<code id="base"></code> <span id="mode"></span></p>
  <ul id="list"></ul>
  <p><a href="publish.html">把下一团火带下山</a></p>
  <p class="dim dev-only">切换后端：在任意页面地址后加 <code>?api=http://主机:4030</code>（会记住），<code>?api=reset</code> 恢复同源。</p>
</main>
<script type="module">
import { api } from "./js/api.js";
import { parseUsdc } from "./shared/curve.mjs";
import { fmtPrice } from "./js/price.js";
import { loadSprite } from "./js/sprites.js";

const priceLabel = (raw) => (Number(raw) === 0 ? "免费" : "$" + fmtPrice(parseUsdc(raw)));
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[ch]));

function paint(canvas, img) {
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

document.getElementById("base").textContent = api.base;
try {
  const cfg = await api.config();
  document.getElementById("mode").textContent = cfg.mock ? "（MOCK）" : `（${cfg.network}）`;
  const [allSignals, img] = await Promise.all([api.signals(), loadSprite("halfie")]);
  // 标题以 __ 开头的是联调时打桩用的内部信号（契约探活、压测），不上公开榜单。
  const signals = allSignals.filter((s) => !String(s.title).startsWith("__"));
  const list = document.getElementById("list");
  list.innerHTML = signals.length
    ? signals.map((s) =>
        `<li><canvas class="mini-halfie" width="20" height="20" style="image-rendering:pixelated" aria-hidden="true"></canvas>` +
        `<span class="sig">#${s.id} ${esc(s.title)} · ${priceLabel(s.price)}</span>` +
        `<a href="s.html?id=${s.id}">购买页</a>` +
        `<a href="live.html?id=${s.id}">大屏</a></li>`
      ).join("")
    : `<li><span class="sig dim">还没有火种。去发布台带下一团下山。</span></li>`;
  for (const c of list.querySelectorAll("canvas")) paint(c, img);
} catch (e) {
  document.getElementById("mode").textContent = "连接失败：" + e.message;
}
</script>
</body>
</html>
