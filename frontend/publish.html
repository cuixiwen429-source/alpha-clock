<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>半衰期 · 发布台</title>
<link rel="stylesheet" href="css/base.css" />
</head>
<body>
<!-- 骨架页：走 POST /api/signals（服务端代发，PRD P1"现场可由脚本代发"）。钱包直发 publish() 待后端定索引方案后再接 -->
<main>
  <h1>把火种带下山。</h1>
  <p class="dim">发布，就是普罗米修斯把火从奥林匹斯带给凡人的那一步。你决定它冷却得有多快。时间之神负责执行，谁也改不了。什么时候伸手，由读到它的人自己决定。</p>
  <form id="f">
    <label>标题（≤60 字）<input name="title" maxlength="60" required /></label>
    <label>免费摘要（≤140 字）<input name="previewText" maxlength="140" /></label>
    <label>正文<textarea name="body" rows="6" required></textarea></label>
    <fieldset>
      <legend>冷却速度</legend>
      <label><input type="radio" name="preset" value="burst" /> 迅猛燃烧：突发，$10 起，30 秒半衰期，约 4 分钟后免费</label>
      <label><input type="radio" name="preset" value="normal" checked /> 匀速冷却：常规，$10 起，120 秒半衰期，约 16 分钟后免费</label>
      <label><input type="radio" name="preset" value="deep" /> 深埋余烬：深度，$50 起，3600 秒半衰期，约 8 小时后免费</label>
    </fieldset>
    <label><input type="checkbox" name="attest" required /> 本内容源自公开信息，不含重大非公开信息</label>
    <button type="submit">带下山</button>
  </form>
  <p id="out" aria-live="polite"></p>
  <p id="err" class="err" role="alert"></p>
</main>
<script type="module">
import { api } from "./js/api.js";

// PRD §5.3 — 三档数字不变，文案只说明冷却速度
const PRESETS = {
  burst: { basePriceMicro: "10000000", floorPriceMicro: "0", halfLife: 30 },
  normal: { basePriceMicro: "10000000", floorPriceMicro: "1000", halfLife: 120 },
  deep: { basePriceMicro: "50000000", floorPriceMicro: "10000", halfLife: 3600 },
};

document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  document.getElementById("err").textContent = "";
  try {
    const r = await api.publish({ title: fd.title, previewText: fd.previewText, body: fd.body, ...PRESETS[fd.preset], attestPublicSource: true });
    const url = new URL(`s.html?id=${r.id}`, location.href).href;
    document.getElementById("out").innerHTML = `火种 #${r.id} 已离开奥林匹斯：<a href="${url}">${url}</a> · <a href="live.html?id=${r.id}">打开大屏</a>`;
  } catch (err) {
    document.getElementById("err").textContent = err.message;
  }
};
</script>
</body>
</html>
