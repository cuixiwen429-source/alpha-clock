name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    name: 契约 + mock + 价格曲线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run ci

  solidity:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
        working-directory: backend/contracts
